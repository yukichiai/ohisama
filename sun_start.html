<style>
  /* 「太陽のない世界」の入口。昼と夜のスイッチと、操作の説明の文字は使わない */
  #help, #timeBtn { display: none !important; }
  /* 最初の画面（タイトル・言語・Start）の中身と文字は、sun_game.js が作る。読みこむまでは、暗い空だけ */
  #gate { background: linear-gradient(#0a1034, #1c2a62 62%, #33407a); }
</style>
<script>
  // このページはいつも「太陽のない世界」のゲーム中（?game=sun）。area_kit.js が sun_game.js を読みこむ。暗い世界のとちゅうなら、はじめから夜で開く
  (function () {
    var q = new URLSearchParams(location.search), g = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
    if (q.get('sun') === 'reset') { try { ['sunGame_started', 'sunGame_ended', 'sunGame_said3', 'sunCircle_ruins', 'sunCircle_mushroom', 'sunCircle_cave'].forEach(function (k) { localStorage.removeItem(k); }); } catch (e) {} }
    q.set('game', 'sun'); if (g('sunGame_started') === '1' && g('sunGame_ended') !== '1') q.set('time', 'night'); else q.delete('time');
    history.replaceState(null, '', location.pathname + '?' + q);
  })();
</script>
<script type="importmap">
